

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle King Arena 3D</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:12px;left:12px;color:white;background:#111c;padding:12px;border-radius:10px}
#joy{position:fixed;bottom:25px;left:25px;width:110px;height:110px;border:2px solid white;border-radius:50%;background:#ffffff33;touch-action:none}
#knob{position:absolute;left:31px;top:31px;width:48px;height:48px;background:white;border-radius:50%}
#help{position:fixed;bottom:15px;right:12px;color:white;background:#111c;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div id="hud">👑 BATTLE KING ARENA<br>3D CAMERA DEMO</div>
<div id="joy"><div id="knob"></div></div>
<div id="help">Joystick: Move<br>Drag screen: Camera</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){alert("Internet connection required. Please reload.");}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,130);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x45633d,1.5));

const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(20,35,15);
sun.castShadow=true;
scene.add(sun);

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x438c43})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Player
const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.BoxGeometry(.8,1.2,.5),
 new THREE.MeshStandardMaterial({color:0x1769aa})
);
body.position.y=1.1;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.3,16,16),
 new THREE.MeshStandardMaterial({color:0xe6b58e})
);
head.position.y=1.9;
head.castShadow=true;
player.add(head);

const legs=[];
for(let i=0;i<2;i++){
 const leg=new THREE.Mesh(
  new THREE.BoxGeometry(.25,.7,.3),
  new THREE.MeshStandardMaterial({color:0x26334c})
 );
 leg.position.set(i===0?-.2:.2,.45,0);
 player.add(leg);
 legs.push(leg);
}
scene.add(player);

// Trees
function tree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.25,2,8),
  new THREE.MeshStandardMaterial({color:0x68452b})
 );
 trunk.position.set(x,1,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.25,3,8),
  new THREE.MeshStandardMaterial({color:0x176b35})
 );
 leaves.position.set(x,3,z);
 scene.add(leaves);
}

for(let i=0;i<45;i++){
 const a=Math.random()*Math.PI*2;
 const r=12+Math.random()*55;
 tree(Math.cos(a)*r,Math.sin(a)*r);
}

// Movement and camera
let angle=0,joyX=0,joyY=0;
let dragging=false,lastX=0;

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-55;
 let y=e.clientY-r.top-55;
 const len=Math.hypot(x,y);
 if(len>35){x=x/len*35;y=y/len*35;}
 joyX=x/35;
 joyY=y/35;
 knob.style.left=(31+x)+"px";
 knob.style.top=(31+y)+"px";
}

joy.addEventListener("pointerdown",e=>{
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
});
joy.addEventListener("pointermove",e=>{
 if(e.buttons)moveJoy(e);
});
function resetJoy(){
 joyX=0;joyY=0;
 knob.style.left="31px";
 knob.style.top="31px";
}
joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);

// Camera rotation
renderer.domElement.addEventListener("pointerdown",e=>{
 dragging=true;
 lastX=e.clientX;
});
window.addEventListener("pointerup",()=>dragging=false);
window.addEventListener("pointermove",e=>{
 if(dragging){
  angle-=(e.clientX-lastX)*.006;
  lastX=e.clientX;
 }
});

// Animation
function animate(){
 requestAnimationFrame(animate);

 const forward=new THREE.Vector3(
  -Math.sin(angle),0,-Math.cos(angle)
 );
 const right=new THREE.Vector3(
  Math.cos(angle),0,-Math.sin(angle)
 );

 player.position.addScaledVector(forward,-joyY*.13);
 player.position.addScaledVector(right,joyX*.13);

 if(Math.abs(joyX)+Math.abs(joyY)>.1){
  player.rotation.y=angle+Math.atan2(joyX,-joyY);
 }

 player.position.x=THREE.MathUtils.clamp(player.position.x,-90,90);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-90,90);

 const desired=new THREE.Vector3(
  player.position.x+Math.sin(angle)*6,
  player.position.y+3.5,
  player.position.z+Math.cos(angle)*6
 );

 camera.position.lerp(desired,.12);
 camera.lookAt(
  player.position.x,
  player.position.y+1,
  player.position.z
 );

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
