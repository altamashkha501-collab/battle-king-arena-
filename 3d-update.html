
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle King Arena 3D Update</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:12px;left:12px;color:white;background:#101827dd;padding:12px;border-radius:10px;font-weight:bold}
#joy{position:fixed;bottom:25px;left:20px;width:110px;height:110px;border:2px solid white;border-radius:50%;background:#ffffff33;touch-action:none}
#knob{position:absolute;left:31px;top:31px;width:48px;height:48px;background:white;border-radius:50%}
#fire{position:fixed;bottom:38px;right:25px;width:85px;height:85px;border-radius:50%;border:3px solid white;background:#dc2626;color:white;font-weight:bold;font-size:17px}
#msg{position:fixed;top:80px;left:12px;color:white;background:#111a;padding:8px;border-radius:8px}
</style>
</head>
<body>
<div id="hud">👑 BATTLE KING ARENA<br>3D SHOOTING DEMO</div>
<div id="msg">Targets: <span id="score">0</span></div>
<div id="joy"><div id="knob"></div></div>
<button id="fire">FIRE</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){
 document.body.innerHTML="Internet connection required. Please reload.";
 throw new Error("Three.js not loaded");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,130);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x45633d,1.5));
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(20,35,15);
scene.add(sun);

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x438c43})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// Player
const player=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.BoxGeometry(.8,1.2,.5),
 new THREE.MeshStandardMaterial({color:0x1769aa})
);
body.position.y=1.1;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.3,16,16),
 new THREE.MeshStandardMaterial({color:0xe6b58e})
);
head.position.y=1.9;
player.add(head);

// Energy gun
const gun=new THREE.Group();
const barrel=new THREE.Mesh(
 new THREE.BoxGeometry(.18,.18,.85),
 new THREE.MeshStandardMaterial({
  color:0x202b3b,metalness:.7,roughness:.3
 })
);
barrel.position.set(.48,1.35,-.5);
gun.add(barrel);

const glow=new THREE.Mesh(
 new THREE.BoxGeometry(.2,.08,.35),
 new THREE.MeshBasicMaterial({color:0x00ddff})
);
glow.position.set(.48,1.48,-.35);
gun.add(glow);

player.add(gun);
scene.add(player);

// Trees
for(let i=0;i<35;i++){
 const a=Math.random()*Math.PI*2;
 const r=12+Math.random()*55;
 const x=Math.cos(a)*r,z=Math.sin(a)*r;

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.25,2,8),
  new THREE.MeshStandardMaterial({color:0x68452b})
 );
 trunk.position.set(x,1,z);
 scene.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.25,3,8),
  new THREE.MeshStandardMaterial({color:0x176b35})
 );
 leaves.position.set(x,3,z);
 scene.add(leaves);
}

// Practice targets
const targets=[];
for(let i=0;i<5;i++){
 const target=new THREE.Group();
 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(.15,.15,1.5,12),
  new THREE.MeshStandardMaterial({color:0x444444})
 );
 base.position.y=.75;
 target.add(base);

 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.55,.12,8,24),
  new THREE.MeshStandardMaterial({color:0xff4444})
 );
 ring.position.y=1.5;
 target.add(ring);

 target.position.set((i-2)*3,0,-12);
 scene.add(target);
 targets.push(target);
}

// Controls
let joyX=0,joyY=0,angle=0;
let dragging=false,lastX=0;
const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-55;
 let y=e.clientY-r.top-55;
 const len=Math.hypot(x,y);
 if(len>35){x=x/len*35;y=y/len*35}
 joyX=x/35;joyY=y/35;
 knob.style.left=31+x+"px";
 knob.style.top=31+y+"px";
}
joy.addEventListener("pointerdown",e=>{
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
});
joy.addEventListener("pointermove",e=>{
 if(e.buttons)moveJoy(e);
});
function resetJoy(){
 joyX=0;joyY=0;
 knob.style.left="31px";
 knob.style.top="31px";
}
joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);

// Camera rotation
renderer.domElement.addEventListener("pointerdown",e=>{
 dragging=true;lastX=e.clientX;
});
window.addEventListener("pointerup",()=>dragging=false);
window.addEventListener("pointermove",e=>{
 if(dragging){
  angle-=(e.clientX-lastX)*.006;
  lastX=e.clientX;
 }
});

// Shooting visual effect
let beams=[];
let score=0;
const scoreText=document.getElementById("score");

function fire(){
 const start=new THREE.Vector3();
 const end=new THREE.Vector3();

 camera.getWorldDirection(end);
 start.copy(camera.position).addScaledVector(end,1.5);

 const beam=new THREE.Mesh(
  new THREE.CylinderGeometry(.035,.035,1,8),
  new THREE.MeshBasicMaterial({color:0x00ddff})
 );

 const distance=15;
 end.multiplyScalar(distance).add(start);

 beam.position.copy(start).add(end).multiplyScalar(.5);
 beam.scale.y=distance;
 beam.quaternion.setFromUnitVectors(
  new THREE.Vector3(0,1,0),
  end.clone().sub(start).normalize()
 );
 scene.add(beam);
 beams.push({mesh:beam,time:18});

 // Practice target hit check
 const ray=new THREE.Raycaster();
 ray.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=ray.intersectObjects(targets,true);
 if(hits.length){
  score++;
  scoreText.textContent=score;
 }
}

document.getElementById("fire").addEventListener("pointerdown",e=>{
 e.preventDefault();
 fire();
});

// Animation
function animate(){
 requestAnimationFrame(animate);

 const forward=new THREE.Vector3(-Math.sin(angle),0,-Math.cos(angle));
 const right=new THREE.Vector3(Math.cos(angle),0,-Math.sin(angle));

 player.position.addScaledVector(forward,-joyY*.13);
 player.position.addScaledVector(right,joyX*.13);

 if(Math.abs(joyX)+Math.abs(joyY)>.1)
  player.rotation.y=angle+Math.atan2(joyX,-joyY);

 player.position.x=THREE.MathUtils.clamp(player.position.x,-90,90);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-90,90);

 const desired=new THREE.Vector3(
  player.position.x+Math.sin(angle)*6,
  player.position.y+3.5,
  player.position.z+Math.cos(angle)*6
 );

 camera.position.lerp(desired,.12);
 camera.lookAt(player.position.x,player.position.y+1,player.position.z);

 beams=beams.filter(b=>{
  b.time--;
  if(b.time<=0){
   scene.remove(b.mesh);
   b.mesh.geometry.dispose();
   b.mesh.material.dispose();
   return false;
  }
  return true;
 });

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
